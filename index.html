<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GUTI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GUTI">
</head>
<body>
  <div id="app">
    <header class="main-header">
      <div class="top-bar">
        <button id="settings-btn" class="icon-btn">⚙️</button>
      </div>
      
      <h1 id="task-title">最低30分ヨガする</h1>
      
      <div class="header-dashboard">
        <div class="month-nav">
          <button id="prev-month-btn" class="nav-btn">◀</button>
          <h2 id="current-month-display">2026年 5月</h2>
          <button id="next-month-btn" class="nav-btn">▶</button>
        </div>
        
        <div class="streak-wrap">
          <div class="streak-badge">
            <span id="streak-number">0</span>
          </div>
          <div class="streak-info">
            <span class="streak-label">日連続！</span>
            <span id="medal-display"></span>
          </div>
        </div>
      </div>
    </header>
    
    <div class="calendar-container">
      <div class="weekdays">
        <span class="sunday">Sun</span>
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
        <span class="saturday">Sat</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="setting-group">
        <p class="setting-label">習慣にしたい日課を変更</p>
        <div class="input-row">
          <input type="text" id="task-input" placeholder="日課を入力してください">
          <button id="save-task-btn">保存</button>
        </div>
      </div>
      <hr class="divider">
      <div class="setting-group">
        <p class="setting-label">OFF日の設定（毎週お休みにする曜日）</p>
        <div id="off-days-container" class="off-days-grid"></div>
      </div>
      <button id="close-settings-btn" class="close-btn">閉じる</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
