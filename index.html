<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GUTI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GUTI">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <!-- ブラウザ風 タブバー -->
    <div class="tabs-bar-wrapper">
      <div id="task-tabs" class="task-tabs-container"></div>
      <button type="button" id="settings-btn" class="icon-btn header-gear">⚙️</button>
    </div>

    <header class="main-header">
      <h1 id="task-title">最低30分ヨガする</h1>
      
      <div class="header-dashboard">
        <div class="month-nav">
          <button type="button" id="prev-month-btn" class="nav-btn">◀</button>
          <h2 id="current-month-display">2026年 5月</h2>
          <button type="button" id="next-month-btn" class="nav-btn">▶</button>
        </div>
        
        <div class="streak-wrap">
          <div class="streak-badge">
            <span id="streak-number">0</span>
          </div>
          <div class="streak-info">
            <span class="streak-label">日連続！</span>
            <span id="medal-display"></span>
          </div>
        </div>
      </div>
    </header>
    
    <div class="calendar-container">
      <div class="weekdays">
        <span class="sunday">Sun</span>
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span>
        <span class="saturday">Sat</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <footer class="app-footer">
      <img src="/icon.png" alt="GUTI Logo" class="footer-logo">
      <span class="footer-text">Get used to it.</span>
    </footer>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-scroll-area">
        <!-- 新規タスク追加 -->
        <div class="setting-group">
          <p class="setting-label">＋ 新しいタスクを追加</p>
          <div class="input-row">
            <input type="text" id="new-task-input" placeholder="例: 読書を20分する">
            <button type="button" id="add-task-btn" class="primary-btn">追加</button>
          </div>
        </div>

        <hr class="divider">

        <!-- 選択中タスクの名称変更 -->
        <div class="setting-group">
          <p class="setting-label">選択中タスクの名称変更</p>
          <div class="input-row">
            <input type="text" id="task-input" placeholder="タスク名を入力">
            <button type="button" id="save-task-btn" class="primary-btn">保存</button>
          </div>
        </div>

        <hr class="divider">

        <!-- OFF日の設定（曜日 or サイクル） -->
        <div class="setting-group">
          <p class="setting-label">OFF日の設定</p>
          
          <div class="off-mode-selector">
            <button type="button" id="mode-weekly-btn" class="mode-tab-btn active">曜日で指定</button>
            <button type="button" id="mode-cycle-btn" class="mode-tab-btn">サイクルで指定</button>
          </div>

          <!-- 曜日指定エリア -->
          <div id="weekly-off-section" class="off-section">
            <div id="off-days-container" class="off-days-grid"></div>
          </div>

          <!-- サイクル指定エリア -->
          <div id="cycle-off-section" class="off-section" style="display: none;">
            <div class="cycle-picker-row">
              <select id="cycle-work-select" class="cycle-select"></select>
              <span class="cycle-label-text">日やったら</span>
              <select id="cycle-rest-select" class="cycle-select"></select>
              <span class="cycle-label-text">日やすみ</span>
            </div>
            <p class="cycle-help-text">※途中で途切れた場合はカウントが1日目にリセットされます</p>
          </div>
        </div>

        <!-- 選択中タスクの削除 -->
        <div id="delete-task-container" class="setting-group" style="margin-top: 15px;">
          <button type="button" id="delete-task-btn" class="sub-danger-btn">このタスクを削除</button>
        </div>

        <hr class="divider">

        <!-- 共通設定 -->
        <div class="setting-group">
          <label class="setting-label toggle-label">
            過去の日付の入力をロックする
            <input type="checkbox" id="lock-past-checkbox">
          </label>
        </div>

        <div class="setting-group" style="margin-top: 20px;">
          <button type="button" id="reset-data-btn" class="danger-btn">すべてのタスクと記録を全リセット</button>
        </div>
      </div>
      <button type="button" id="close-settings-btn" class="close-btn">閉じる</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
